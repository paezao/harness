name: test

on:
  push:
  pull_request:

jobs:
  templates:
    # Windows too: developers run the hooks under Git Bash.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Template tests
        shell: bash
        run: bash tests/run.sh
